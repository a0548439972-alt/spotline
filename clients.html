<!doctype html>
<html lang="he" dir="rtl" data-slx-off>
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>אזור לקוחות - ספוטליין</title>
<meta name="theme-color" content="#0a0a0a">
<style>
@font-face{font-family:"Primaries";src:url("assets/fonts/primaries-light-aaa.otf") format("opentype");font-weight:300;font-display:swap}
@font-face{font-family:"Primaries";src:url("assets/fonts/primaries-regular-aaa.otf") format("opentype");font-weight:400;font-display:swap}
@font-face{font-family:"Primaries";src:url("assets/fonts/primaries-medium-aaa.otf") format("opentype");font-weight:500;font-display:swap}
@font-face{font-family:"Primaries";src:url("assets/fonts/primaries-bold-aaa.otf") format("opentype");font-weight:700;font-display:swap}
@font-face{font-family:"Primaries";src:url("assets/fonts/primaries-black-aaa.otf") format("opentype");font-weight:900;font-display:swap}
@font-face{font-family:"Placebo";src:url("assets/fonts/placebo-bold-fm.otf") format("opentype");font-weight:700;font-display:swap}

:root{--y:#FFBD00;--k:#0a0a0a;--bg:#f3efe7;--panel:#fffdf9;--tx:#17140f;--mut:#5c554a;--dim:#8f897f;--line:rgba(26,21,13,.12);--line2:rgba(26,21,13,.22);--gold:#9a6c00;--ok:#2f6b3a;--bad:#a3341f;--ease:cubic-bezier(.16,1,.3,1);--side:2.5rem}
*{box-sizing:border-box}
html{font-size:16px;background:var(--bg);-webkit-text-size-adjust:100%}
@media (min-width:1100px){html{font-size:calc(100vw / 90)}}
body{margin:0;font-family:"Primaries",system-ui,sans-serif;color:var(--tx);background:var(--bg);font-size:1rem;line-height:1.45;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--y);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}
.ltr{direction:ltr;unicode-bidi:isolate}

/* buttons: a circle in the button colour grows from where the pointer came in */
.b{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;height:2.75rem;padding:0 1.25rem;border:1px solid transparent;font-weight:700;font-size:.95rem;white-space:nowrap;background:none;text-decoration:none;transition:color .4s var(--ease),border-color .4s}
.b svg{width:1.1rem;height:1.1rem;flex:none}
.b .rip{position:absolute;z-index:-1;border-radius:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;transition:transform .55s var(--ease)}
.b-y{background:var(--y);color:var(--k)}.b-y .rip{background:var(--k)}.b-y.hov{color:var(--y)}
.b-k{background:var(--k);color:#fff}.b-k .rip{background:var(--y)}.b-k.hov{color:var(--k)}
.b-o{border-color:var(--line2);color:var(--tx)}.b-o .rip{background:var(--k)}.b-o.hov{color:#fff;border-color:var(--k)}
.b-t{color:var(--mut);height:2.25rem;padding:0 .75rem;font-weight:500}.b-t .rip{background:rgba(26,21,13,.08)}
.b-d{color:var(--bad);border-color:rgba(163,52,31,.35)}.b-d .rip{background:var(--bad)}.b-d.hov{color:#fff}
.dark .b-o{border-color:rgba(243,239,231,.25);color:#f3efe7}.dark .b-o .rip{background:#f3efe7}.dark .b-o.hov{color:var(--k)}
.b-sm{height:2.25rem;padding:0 .9rem;font-size:.875rem}
@media (prefers-reduced-motion:reduce){.b .rip{display:none}.b:hover{filter:brightness(1.08)}*{transition-duration:.01ms!important}}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--k);color:#f3efe7;display:flex;align-items:center;gap:1.25rem;height:4.25rem;padding:0 var(--side)}
.top .lg{display:flex;align-items:center;gap:1rem;text-decoration:none}
.top .lg svg{height:2.4rem;width:auto;color:#f3efe7}
.lg-arc{fill:none;stroke:currentColor;stroke-width:3}.lg-stem{fill:none;stroke:currentColor;stroke-width:2.4}
.top .lg span{font-size:.9rem;color:#a39e94;border-inline-start:1px solid rgba(243,239,231,.2);padding-inline-start:1rem;line-height:1.1}
.top .lg span b{display:block;color:#f3efe7;font-size:1.05rem;font-weight:700}
.top .sp{flex:1}
.top .note{font-size:.8rem;color:#a39e94;display:flex;align-items:center;gap:.5rem}
.top .note i{width:.5rem;height:.5rem;border-radius:50%;background:var(--y);display:inline-block}
.menu{position:relative}
.menu-p{position:absolute;inset-inline-end:0;top:calc(100% + .5rem);background:var(--panel);color:var(--tx);min-width:15rem;border:1px solid var(--line);box-shadow:0 1rem 2.5rem rgba(0,0,0,.18);padding:.4rem;display:grid}
.menu-p button,.menu-p a,.menu-p label{display:flex;align-items:center;gap:.6rem;text-align:start;padding:.7rem .8rem;border:0;background:none;font-size:.92rem;text-decoration:none;cursor:pointer}
.menu-p button:hover,.menu-p a:hover,.menu-p label:hover{background:var(--bg)}
.menu-p hr{border:0;border-top:1px solid var(--line);margin:.3rem 0}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:24rem 1fr;min-height:calc(100vh - 4.25rem)}
.side{border-inline-end:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:sticky;top:4.25rem;height:calc(100vh - 4.25rem)}
.side-h{padding:1.25rem 1.25rem .75rem;display:grid;gap:.75rem;border-bottom:1px solid var(--line)}
.srch{display:flex;align-items:center;gap:.5rem;border:1px solid var(--line2);background:#fff;height:2.75rem;padding:0 .8rem}
.srch svg{width:1.05rem;height:1.05rem;color:var(--dim);flex:none}
.srch input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:.95rem}
.chips{display:flex;gap:.4rem;flex-wrap:wrap}
.chip{border:1px solid var(--line2);background:none;height:2rem;padding:0 .75rem;font-size:.82rem;font-weight:500;color:var(--mut)}
.chip[aria-pressed=true]{background:var(--k);color:#fff;border-color:var(--k)}
.list{overflow:auto;flex:1;padding:.4rem 0}
.ci{display:grid;grid-template-columns:2.6rem 1fr auto;gap:.15rem .8rem;align-items:center;padding:.8rem 1.25rem;border:0;background:none;width:100%;text-align:start;border-inline-start:3px solid transparent}
.ci:hover{background:var(--bg)}
.ci[aria-current=true]{background:var(--bg);border-inline-start-color:var(--y)}
.av{grid-row:span 2;width:2.6rem;height:2.6rem;border-radius:50%;background:#e8e1d3;display:grid;place-items:center;font-weight:700;font-size:1rem;color:var(--tx)}
.ci .av.live{background:var(--y)}
.ci b{font-weight:700;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ci small{color:var(--mut);font-size:.8rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;grid-column:2}
.ci .when{grid-row:1;grid-column:3;font-size:.75rem;color:var(--dim)}
.ci .st{grid-row:2;grid-column:3}
.empty-l{padding:2rem 1.25rem;color:var(--mut);font-size:.92rem}

.main{padding:2rem var(--side) 4rem;min-width:0}
.welcome{max-width:38rem;padding-top:3rem}
.welcome h1{font:700 2.6rem/1.1 "Placebo","Primaries",sans-serif;margin:0 0 1rem}
.welcome h1 em{font-style:normal;color:var(--gold)}
.welcome p{color:var(--mut);font-size:1.05rem;margin:0 0 1.75rem}
.steps3{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin:2rem 0}
.steps3 div{background:var(--panel);padding:1.1rem}
.steps3 b{display:block;font-size:.95rem;margin-bottom:.25rem}
.steps3 span{font-size:.85rem;color:var(--mut)}
.steps3 i{font-style:normal;color:var(--gold);font-weight:700;font-size:.8rem;display:block;margin-bottom:.4rem}

/* status tags */
.tag{display:inline-flex;align-items:center;gap:.35rem;font-size:.72rem;font-weight:700;padding:.15rem .5rem;border:1px solid currentColor;white-space:nowrap;line-height:1.4}
.tag::before{content:"";width:.4rem;height:.4rem;border-radius:50%;background:currentColor}
.t-draft{color:var(--dim)}.t-sent{color:#1f5f8b}.t-approved{color:var(--gold)}.t-part{color:#7a5a12}.t-bought{color:var(--ok)}.t-cancel{color:var(--bad)}

/* ---------- client card ---------- */
.back{display:none}
.ch{display:flex;align-items:flex-start;gap:1.5rem;flex-wrap:wrap;padding-bottom:1.5rem;border-bottom:1px solid var(--line)}
.ch .av{width:4rem;height:4rem;font-size:1.5rem;grid-row:auto}
.ch .who{flex:1;min-width:14rem}
.ch h1{margin:0;font:700 2.2rem/1.1 "Placebo","Primaries",sans-serif}
.ch .meta{display:flex;flex-wrap:wrap;gap:.25rem 1rem;margin-top:.5rem;color:var(--mut);font-size:.92rem}
.ch .meta a{text-decoration:none;border-bottom:1px solid var(--line2)}
.ch .acts{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.live-bar{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem;background:var(--k);color:#f3efe7;padding:.8rem 1rem;margin-top:1.25rem;font-size:.92rem}
.live-bar i{width:.55rem;height:.55rem;border-radius:50%;background:var(--y);box-shadow:0 0 0 .3rem rgba(255,189,0,.2);flex:none}
.live-bar .sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.stats div{padding:1.1rem 0;border-inline-start:1px solid var(--line);padding-inline-start:1.25rem}
.stats div:first-child{border:0;padding-inline-start:0}
.stats small{display:block;color:var(--mut);font-size:.8rem}
.stats b{font-size:1.5rem;font-weight:700}
.tabs{display:flex;gap:2rem;border-bottom:1px solid var(--line);margin-top:.5rem}
.tab{border:0;background:none;padding:1rem 0 .85rem;font-weight:500;color:var(--mut);border-bottom:2px solid transparent;margin-bottom:-1px;font-size:1rem}
.tab[aria-selected=true]{color:var(--tx);border-bottom-color:var(--y);font-weight:700}
.tab span{color:var(--dim);font-weight:400}
.pane{padding-top:1.5rem}

/* quotes */
.qbar{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem}
.qchip{display:flex;flex-direction:column;align-items:flex-start;gap:.15rem;border:1px solid var(--line2);background:var(--panel);padding:.55rem .9rem;min-width:9rem;text-align:start}
.qchip b{font-size:.9rem}
.qchip small{font-size:.75rem;color:var(--mut)}
.qchip[aria-pressed=true]{border-color:var(--k);box-shadow:inset 0 -3px 0 var(--y)}
.qhead{display:grid;grid-template-columns:1fr auto;gap:1rem;align-items:end;background:var(--panel);border:1px solid var(--line);padding:1.25rem}
.qhead .ttl{display:grid;gap:.35rem}
.qhead input.qt{font:700 1.5rem/1.2 "Primaries",sans-serif;border:0;border-bottom:1px dashed var(--line2);background:none;padding:.1rem 0;width:100%;outline:0}
.qhead input.qt:focus{border-bottom-color:var(--k)}
.qhead .sub{display:flex;flex-wrap:wrap;gap:.25rem 1.25rem;font-size:.85rem;color:var(--mut)}
.qhead .ctl{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
label.f{display:grid;gap:.3rem;font-size:.8rem;color:var(--mut);font-weight:500}
.inp,select.inp,textarea.inp{border:1px solid var(--line2);background:#fff;height:2.6rem;padding:0 .7rem;font-size:.95rem;color:var(--tx);border-radius:0;width:100%}
textarea.inp{height:auto;padding:.6rem .7rem;resize:vertical;min-height:4.5rem}
.inp:focus{outline:0;border-color:var(--k);box-shadow:0 0 0 3px rgba(255,189,0,.35)}

.lines{margin-top:1rem;background:var(--panel);border:1px solid var(--line)}
.lh,.ln{display:grid;grid-template-columns:4rem minmax(10rem,1fr) 8rem 7rem 7rem 6.5rem 5rem 2.5rem;gap:.9rem;align-items:center;padding:.75rem 1rem}
.lh{font-size:.75rem;color:var(--mut);font-weight:700;border-bottom:1px solid var(--line);padding-top:.6rem;padding-bottom:.6rem}
.ln{border-bottom:1px solid var(--line)}
.ln:last-child{border-bottom:0}
.ln.got{background:linear-gradient(90deg,rgba(47,107,58,.06),transparent)}
.th{width:4rem;height:4rem;background:#efe9de;display:grid;place-items:center;overflow:hidden}
.th img{width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.th svg{width:1.6rem;height:1.6rem;color:var(--dim)}
.pn b{display:block;font-size:.98rem;line-height:1.3}
.pn small{display:block;color:var(--mut);font-size:.8rem}
.pn .nt{border:0;background:none;padding:0;color:var(--gold);font-size:.78rem;font-weight:500;margin-top:.2rem}
.pn .nt-in{margin-top:.4rem;height:2.1rem;font-size:.85rem}
.ln .inp{height:2.4rem;font-size:.9rem}
.qty{display:flex;align-items:center;border:1px solid var(--line2);background:#fff;height:2.4rem;width:100%}
.qty button{width:2.2rem;height:100%;border:0;background:none;font-size:1.1rem;color:var(--mut);flex:none}
.qty button:hover{background:var(--bg);color:var(--tx)}
.qty input{width:100%;min-width:0;border:0;text-align:center;outline:0;height:100%;background:none;font-weight:700;-moz-appearance:textfield}
.qty input::-webkit-inner-spin-button{display:none}
.money{position:relative}
.money input{padding-inline-end:1.7rem;direction:ltr;text-align:right}
.money::before{content:"₪";position:absolute;inset-inline-end:.65rem;top:50%;transform:translateY(-50%);color:var(--dim);font-size:.85rem;pointer-events:none}
.money.miss input{border-color:rgba(163,52,31,.45);background:#fff8f5}
.sum{font-weight:700;font-size:.98rem;direction:ltr;text-align:right}
.sum.dash{color:var(--dim);font-weight:400}
.got-c{display:flex;align-items:center;gap:.4rem;font-size:.8rem;color:var(--mut);cursor:pointer;user-select:none}
.got-c input{width:1.15rem;height:1.15rem;accent-color:var(--ok);margin:0}
.got-c.on{color:var(--ok);font-weight:700}
.rm{border:0;background:none;width:2.2rem;height:2.2rem;display:grid;place-items:center;color:var(--dim)}
.rm:hover{color:var(--bad);background:#fff1ec}
.rm svg{width:1rem;height:1rem}
.nolines{padding:2.5rem 1.25rem;text-align:center;color:var(--mut)}
.nolines b{display:block;color:var(--tx);font-size:1.1rem;margin-bottom:.3rem}

.addrow{display:flex;gap:.75rem;align-items:flex-start;padding:1rem;border-top:1px solid var(--line);background:#fbf8f2;flex-wrap:wrap}
.pick{position:relative;flex:1;min-width:16rem}
.pick .res{position:absolute;inset-inline:0;top:calc(100% + .25rem);background:#fff;border:1px solid var(--line2);box-shadow:0 1rem 2rem rgba(0,0,0,.12);z-index:20;max-height:22rem;overflow:auto}
.pick .res button{display:grid;grid-template-columns:2.8rem 1fr;gap:.7rem;align-items:center;width:100%;border:0;background:none;padding:.5rem .7rem;text-align:start;border-bottom:1px solid var(--line)}
.pick .res button:hover,.pick .res button.on{background:var(--bg)}
.pick .res .th{width:2.8rem;height:2.8rem}
.pick .res b{font-size:.9rem;display:block}
.pick .res small{font-size:.75rem;color:var(--mut)}
.pick .res .none{padding:.9rem;color:var(--mut);font-size:.88rem}

.qfoot{display:grid;grid-template-columns:1fr 24rem;gap:1.5rem;margin-top:1.25rem;align-items:start}
.notes{display:grid;gap:1rem}
.tot{background:var(--panel);border:1px solid var(--line);padding:1.1rem 1.25rem;display:grid;gap:.55rem}
.tot .r{display:flex;justify-content:space-between;align-items:center;font-size:.95rem;gap:1rem}
.tot .r span:last-child{direction:ltr;font-weight:500}
.tot .r.big{border-top:1px solid var(--line2);padding-top:.75rem;margin-top:.25rem;font-size:1.25rem;font-weight:700}
.tot .r.big span:last-child{font-weight:700}
.tot .r.mut{color:var(--mut);font-size:.85rem}
.tot .disc{display:flex;gap:.4rem;align-items:center}
.tot .disc input{width:5.5rem;height:2.2rem;direction:ltr;text-align:right}
.tot .disc select{width:3.4rem;height:2.2rem;padding:0 .3rem}
.tot .warn{font-size:.8rem;color:var(--bad)}
.tgl{display:flex;align-items:center;gap:.5rem;font-size:.85rem;color:var(--mut);cursor:pointer}
.tgl input{accent-color:var(--k);width:1rem;height:1rem;margin:0}
.qacts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:1.25rem;padding-top:1.25rem;border-top:1px solid var(--line)}
.qacts .sp{flex:1}

/* purchases + log */
.buy-g{margin-bottom:1.75rem}
.buy-g h3{font-size:.85rem;color:var(--mut);font-weight:700;margin:0 0 .5rem;display:flex;gap:.75rem;align-items:baseline}
.buy-g h3 span{font-weight:400}
.buy{display:grid;grid-template-columns:3rem 1fr 5rem 7rem 7rem;gap:.9rem;align-items:center;padding:.6rem 1rem;background:var(--panel);border:1px solid var(--line);border-bottom:0}
.buy:last-child{border-bottom:1px solid var(--line)}
.buy .th{width:3rem;height:3rem}
.buy b{font-size:.92rem;display:block}
.buy small{font-size:.78rem;color:var(--mut)}
.buy .n{text-align:center;font-weight:700}
.buy .m{direction:ltr;text-align:right}
.buy-tot{display:flex;justify-content:space-between;background:var(--k);color:#f3efe7;padding:1rem 1.25rem;font-size:1.1rem;font-weight:700;margin-bottom:1.75rem}
.buy-tot span:last-child{direction:ltr;color:var(--y)}
.log-add{display:flex;gap:.6rem;margin-bottom:1.25rem}
.log-add textarea{min-height:2.75rem;height:2.75rem}
.log{list-style:none;margin:0;padding:0;border-inline-start:2px solid var(--line2)}
.log li{position:relative;padding:0 1.25rem 1.1rem}
.log li::before{content:"";position:absolute;inset-inline-start:-.36rem;top:.35rem;width:.6rem;height:.6rem;border-radius:50%;background:var(--bg);border:2px solid var(--dim)}
.log li.man::before{background:var(--y);border-color:var(--y)}
.log time{display:block;font-size:.75rem;color:var(--dim)}
.log p{margin:.1rem 0 0;font-size:.95rem;white-space:pre-wrap}
.det{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1rem;max-width:46rem}
.det .full{grid-column:1/-1}

/* dialogs */
dialog{border:0;padding:0;background:var(--panel);color:var(--tx);width:min(34rem,calc(100vw - 2rem));box-shadow:0 2rem 5rem rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,10,10,.6)}
.dl-h{display:flex;align-items:center;justify-content:space-between;padding:1.1rem 1.4rem;border-bottom:1px solid var(--line)}
.dl-h h2{margin:0;font-size:1.25rem}
.dl-b{padding:1.4rem;display:grid;gap:1rem}
.dl-f{padding:1rem 1.4rem;border-top:1px solid var(--line);display:flex;gap:.6rem;justify-content:flex-start}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.err{color:var(--bad);font-size:.78rem;font-weight:500}
.x{border:0;background:none;width:2.4rem;height:2.4rem;display:grid;place-items:center;color:var(--mut)}
.x:hover{background:var(--bg)}
.x svg{width:1.1rem;height:1.1rem}

/* login */
.gate{min-height:100vh;display:grid;place-items:center;background:var(--k);color:#f3efe7;padding:2rem}
.gate-in{width:min(24rem,100%);text-align:center}
.gate svg.lgo{height:4.5rem;width:auto;margin-bottom:2rem}
.gate h1{font:700 1.6rem/1.2 "Placebo","Primaries",sans-serif;margin:0 0 .5rem}
.gate p{color:#a39e94;margin:0 0 1.75rem;font-size:.95rem}
.pin{display:flex;gap:.6rem;justify-content:center;margin-bottom:1rem;direction:ltr}
.pin input{width:3.2rem;height:3.8rem;text-align:center;font-size:1.6rem;font-weight:700;background:#151413;border:1px solid rgba(243,239,231,.2);color:#fff;outline:0}
.pin input:focus{border-color:var(--y);box-shadow:0 0 0 3px rgba(255,189,0,.25)}
.gate .err{min-height:1.2rem;color:#ff8f75;margin-bottom:1rem}
.gate .b{width:100%}
.gate small{display:block;margin-top:1.5rem;color:#6f6a62;font-size:.8rem}
.shake{animation:sh .4s}
@keyframes sh{20%,60%{transform:translateX(-.5rem)}40%,80%{transform:translateX(.5rem)}}

.toast{position:fixed;bottom:1.5rem;left:50%;transform:translate(-50%,150%);visibility:hidden;background:var(--k);color:#f3efe7;padding:.85rem 1.25rem;font-size:.92rem;z-index:100;transition:transform .45s var(--ease);display:flex;gap:1rem;align-items:center;max-width:calc(100vw - 2rem)}
.toast.on{transform:translate(-50%,0);visibility:visible}
.toast button{border:0;background:none;color:var(--y);font-weight:700;padding:0}

/* ---------- tablet / phone ---------- */
@media (max-width:1180px){
  .lh,.ln{grid-template-columns:3.4rem minmax(0,1fr) 7rem 7.5rem 7.5rem 2.4rem;grid-template-areas:"th pn qty pr sum rm" "th room room got got rm"}
  .lh{display:none}

/* ---------------- login ---------------- */
async function hash(s){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("spotline:"+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"p"+s}}
const pins=$$("#pin input");
let setting=false,firstPin=null;
function gate(){
  const g=$("#gate");$("#appWrap").hidden=true;g.hidden=false;
  setting=!db.pin;firstPin=null;
  $("#gateT").textContent=setting?"קוד כניסה חדש":"אזור לקוחות";
  $("#gateP").textContent=setting?"פעם ראשונה כאן. בחרו קוד של 4 ספרות לצוות החנות.":"כניסת צוות החנות. הקלידו את קוד הכניסה.";
  $("#gateB").textContent=setting?"המשך":"כניסה";
  pins.forEach(i=>i.value="");$("#gateE").textContent="";setTimeout(()=>pins[0].focus(),50);rip(g);
}
pins.forEach((inp,i)=>{
  inp.addEventListener("input",()=>{inp.value=inp.value.replace(/\D/g,"").slice(-1);if(inp.value&&i<3)pins[i+1].focus();if(pins.every(x=>x.value))$("#gateF").requestSubmit()});
  inp.addEventListener("keydown",e=>{if(e.key==="Backspace"&&!inp.value&&i>0){pins[i-1].focus();pins[i-1].value=""}});
  inp.addEventListener("paste",e=>{const t=(e.clipboardData.getData("text")||"").replace(/\D/g,"").slice(0,4);if(t.length===4){e.preventDefault();t.split("").forEach((c,j)=>pins[j].value=c);$("#gateF").requestSubmit()}});
});
$("#gateF").addEventListener("submit",async e=>{e.preventDefault();const v=pins.map(x=>x.value).join("");
  const bad=m=>{$("#gateE").textContent=m;const p=$("#pin");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake");pins.forEach(x=>x.value="");pins[0].focus()};
  if(v.length<4)return bad("צריך 4 ספרות");
  if(setting){if(!firstPin){firstPin=v;$("#gateP").textContent="עוד פעם, לאישור.";pins.forEach(x=>x.value="");pins[0].focus();$("#gateE").textContent="";return}
    if(firstPin!==v){firstPin=null;$("#gateP").textContent="בחרו קוד של 4 ספרות לצוות החנות.";return bad("הקודים לא תאמו. מתחילים מחדש")}
    db.pin=await hash(v)}
  else if(await hash(v)!==db.pin)return bad("הקוד לא נכון");
  db.staff=now()+12*3600e3;commit();enter()});

let filter="all",cur=null,curQ=null,tab="q";
function enter(){$("#gate").hidden=true;$("#appWrap").hidden=false;rip(document);route();renderList()}
function route(){const h=new URLSearchParams(location.hash.slice(1)),c=h.get("c");
  if(c&&C(c)){cur=c;const q=h.get("q");curQ=q&&C(c).quotes.some(x=>x.id===q)?q:(C(c).quotes[0]||{}).id;tab=h.get("t")||"q"}else{cur=null}
  renderMain()}
function go(c,q,t){const p=new URLSearchParams();if(c)p.set("c",c);if(q)p.set("q",q);if(t&&t!=="q")p.set("t",t);history.pushState(null,"","#"+p);route();renderList();window.scrollTo({top:0})}
addEventListener("popstate",()=>{route();renderList()});

function lastQ(c){return c.quotes.slice().sort((a,b)=>b.updated-a.updated)[0]}
function renderList(){
  const s=$("#q").value.trim().toLowerCase();
  let L=db.clients.slice().sort((a,b)=>b.updated-a.updated);
  if(s)L=L.filter(c=>[c.name,c.phone,c.city,c.ref].join(" ").toLowerCase().includes(s)||String(c.phone||"").replace(/\D/g,"").includes(s.replace(/\D/g,"")||"#"));
  if(filter==="open")L=L.filter(c=>c.quotes.some(q=>["draft","sent","approved"].includes(q.status)&&q.lines.length));
  if(filter==="bought")L=L.filter(c=>c.quotes.some(q=>q.lines.some(l=>l.bought>0)));
  if(filter==="pro")L=L.filter(c=>["designer","architect"].includes(c.type));
  const act=db.active&&db.active.cid;
  $("#list").innerHTML=L.length?L.map(c=>{const q=lastQ(c);return`<button class="ci" type="button" data-c="${c.id}" aria-current="${c.id===cur}"><span class="av${c.id===act?" live":""}" aria-hidden="true">${esc(ini(c.name))}</span><b>${esc(c.name)}</b><span class="when">${rel(c.updated)}</span><small>${esc([TYPES[c.type]!=="לקוח פרטי"?TYPES[c.type]:"",c.city,c.phone].filter(Boolean).join(" · ")||"בלי פרטים")}</small><span class="st">${q&&q.lines.length?tagHTML(q.status):""}</span></button>`}).join("")
    :`<div class="empty-l">${db.clients.length?"אין לקוח שמתאים לחיפוש.":"עוד אין לקוחות. לוחצים על \"לקוח חדש\" ומתחילים."}</div>`;
  $("#app").classList.toggle("open",!!cur);
}
$("#list").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(b)go(b.dataset.c)});
$("#q").addEventListener("input",renderList);

function totHTML(q,t){
  return`<div class="r"><span>${t.items} פריטים</span><span>${ils(t.sub)}</span></div>
  <div class="r"><span>הנחה</span><span class="disc"><input class="inp" type="number" min="0" value="${q.disc||""}" placeholder="0" data-qf="disc" aria-label="הנחה"><select class="inp" data-qf="discT" aria-label="סוג הנחה"><option value="p"${q.discT==="p"?" selected":""}>%</option><option value="s"${q.discT==="s"?" selected":""}>₪</option></select></span></div>
  ${t.disc?`<div class="r mut"><span>אחרי הנחה</span><span>${ils(t.sub-t.disc)}</span></div>`:""}
  <div class="r mut"><span>${q.vatIn?"מתוכו מע״מ 18%":"מע״מ 18%"}</span><span>${ils(t.vat)}</span></div>
  <div class="r big"><span>סה״כ לתשלום</span><span>${ils(t.gross)}</span></div>
  <label class="tgl"><input type="checkbox" data-qf="vatIn"${q.vatIn?" checked":""}>המחירים שהוקלדו כוללים מע״מ</label>
  ${t.miss?`<div class="warn">${t.miss===1?"לשורה אחת":`ל-${t.miss} שורות`} אין מחיר עדיין.</div>`:""}`;
}

/* quote events (delegated on #main) */
const curC=()=>C(cur),curQuote=()=>{const c=curC();return c&&c.quotes.find(x=>x.id===curQ)};
const lineOf=el=>{const q=curQuote(),r=el.closest("[data-l]");return r&&q.lines.find(l=>l.lid===r.dataset.l)};
function pushToCart(q){/* keep the site basket equal to the active quote */if(db.active&&db.active.qid===q.id)localStorage.setItem(S.CART,JSON.stringify(q.lines.filter(l=>l.raw).map(l=>Object.assign({},l.raw,{q:l.q}))))}
function touch(q){const c=curC();q.updated=c.updated=now();refreshStatus(q);commit();pushToCart(q);db=S.load()||db}
function softUpdate(){/* totals and line sums without re-rendering inputs */
  const q=curQuote();if(!q)return;
  $$("#lines .ln").forEach(r=>{const l=q.lines.find(x=>x.lid===r.dataset.l);if(!l)return;const t=lineTot(l),s=$("[data-sum]",r);s.textContent=t==null?"חסר מחיר":ils(t);s.classList.toggle("dash",t==null);$(".money",r).classList.toggle("miss",l.price==null||l.price==="")});
  const si=$("#stItems");if(si)si.textContent=totals(q).items;
  const f=document.activeElement,inTot=f&&f.closest("#tot");if(!inTot)$("#tot").innerHTML=totHTML(q,totals(q));
  else{const t=totals(q),rows=$$("#tot .r");/* keep focus in the discount field */rows[0].lastElementChild.textContent=ils(t.sub);$("#tot .big span:last-child").textContent=ils(t.gross);const vr=$$("#tot .r.mut");vr.length&&(vr[vr.length-1].lastElementChild.textContent=ils(t.vat))}
}
$("#main").addEventListener("input",e=>{
  const q=curQuote();if(!q)return;const t=e.target;
  if(t.dataset.qf){const k=t.dataset.qf;if(k==="vatIn")return;q[k]=t.type==="number"?(t.value===""?0:+t.value):t.value;if(k==="valid")q.valid=Math.max(1,Math.min(120,+t.value||14));touch(q);softUpdate();if(k==="title")$$(`.qchip[data-q="${q.id}"] b`).forEach(b=>b.textContent=q.title);return}
  const l=lineOf(t);if(!l||!t.dataset.lf)return;const k=t.dataset.lf;
  if(k==="q"){l.q=Math.max(1,Math.min(999,parseInt(t.value,10)||1))}
  else if(k==="price"){l.price=t.value===""?null:Math.max(0,+t.value);if(l.sku&&l.price!=null){db.prices[l.sku]={p:l.price,d:now()}}}
  else l[k]=t.value;
  touch(q);softUpdate();
});
$("#main").addEventListener("change",e=>{
  const q=curQuote(),t=e.target;if(!q)return;
  if(t.dataset.qf==="vatIn"){q.vatIn=t.checked;touch(q);$("#tot").innerHTML=totHTML(q,totals(q));return}
  if(t.dataset.qf==="status"){const c=curC();q.status=t.value;log(c,`${q.title}: הסטטוס שונה ל"${ST[q.status][0]}"`);if(q.status==="bought")q.lines.forEach(l=>{if(l.bought<l.q){l.bought=l.q;l.boughtAt=l.boughtAt||now()}});touch(q);renderMain();renderList();return}
  if(t.dataset.qf==="discT"||t.dataset.qf==="disc"){if(q.disc<0)q.disc=0;touch(q);$("#tot").innerHTML=totHTML(q,totals(q));return}
  if(t.dataset.lf==="q"){const l=lineOf(t);t.value=l.q}
  if(t.matches("[data-got]")){const l=lineOf(t),c=curC();if(t.checked){l.bought=l.q;l.boughtAt=now();log(c,`נקנה: ${l.n} × ${l.q}`)}else{l.bought=0;l.boughtAt=""}touch(q);renderMain();renderList()}
});
$("#main").addEventListener("click",async e=>{
  const t=e.target,c=curC();
  if(t.closest("[data-new]")){openClient();return}
  if(t.closest("[data-back]")){go(null);return}
  const tb=t.closest("[data-tab]");if(tb){tab=tb.dataset.tab;go(cur,curQ,tab);return}
  const qc=t.closest("[data-q]");if(qc){go(cur,qc.dataset.q);return}
  if(t.closest("[data-shop]")){shop(c,curQ||newQuote(c).id);return}
  if(t.closest("[data-shopq]")){shop(c,curQ);return}
  if(t.closest("[data-end]")){S.endClient();db=S.load();toast("סיימנו עם הלקוח. הסל באתר חזר להיות רגיל.");renderMain();renderList();return}
  if(t.closest("[data-newq]")){const q=newQuote(c);log(c,`נפתחה ${q.title}`);touch(q);go(cur,q.id);return}
  const q=curQuote();if(!q)return;
  if(t.closest("[data-inc],[data-dec]")){const l=lineOf(t);l.q=Math.max(1,Math.min(999,l.q+(t.closest("[data-inc]")?1:-1)));$("[data-lf=q]",t.closest(".ln")).value=l.q;touch(q);softUpdate();return}
  if(t.closest("[data-note]")){const l=lineOf(t);l._note=1;const r=t.closest(".ln");r.outerHTML=lineHTML(l);const inp=$(`[data-l="${l.lid}"] [data-lf=note]`);inp&&inp.focus();delete l._note;return}
  if(t.closest("[data-rm]")){const l=lineOf(t),i=q.lines.indexOf(l);q.lines.splice(i,1);touch(q);renderMain();toast(`הוסר: ${l.n}`,()=>{const qq=curQuote();if(!qq)return;qq.lines.splice(Math.min(i,qq.lines.length),0,l);touch(qq);renderMain()});return}
  if(t.closest("[data-free]")){q.lines.push({lid:uid("l"),manual:true,kind:"free",n:"",sku:"",q:1,price:null,room:"",note:"",bought:0,boughtAt:"",added:now()});touch(q);renderMain();const ins=$$("#lines [data-lf=n]");ins.length&&ins[ins.length-1].focus();return}
  if(t.closest("[data-print]")){printQuote(c,q);return}
  if(t.closest("[data-send]")){sendWA(c,q);return}
  if(t.closest("[data-allgot]")){if(!q.lines.length)return;if(!await ask("לסמן את כל ההצעה כנקנתה?",`${q.lines.length} שורות יסומנו כנקנו היום, ויופיעו בלשונית "מה קנה".`,"כן, נקנה"))return;
    q.lines.forEach(l=>{if(l.bought<l.q){l.bought=l.q;l.boughtAt=now()}});log(c,`${q.title} נקנתה (${ils(totals(q).gross)})`);touch(q);renderMain();renderList();toast("סומן כנקנה");return}
  if(t.closest("[data-dup]")){db.seq++;const n=JSON.parse(JSON.stringify(q));Object.assign(n,{id:uid("q"),no:`${new Date().getFullYear()}-${String(db.seq).padStart(4,"0")}`,title:q.title+" (גרסה חדשה)",status:"draft",created:now(),updated:now()});n.lines.forEach(l=>{l.lid=uid("l");l.bought=0;l.boughtAt=""});c.quotes.unshift(n);log(c,`שוכפלה ${q.title}`);touch(n);go(cur,n.id);toast("נוצרה גרסה חדשה של ההצעה");return}
  if(t.closest("[data-delq]")){if(!await ask("למחוק את ההצעה?",`"${q.title}" עם ${q.lines.length} שורות תימחק מהכרטיס. אי אפשר לשחזר.`,"מחיקה",true))return;
    if(db.active&&db.active.qid===q.id){S.endClient();db=S.load()}const cc=curC();cc.quotes=cc.quotes.filter(x=>x.id!==q.id);log(cc,`נמחקה ${q.title}`);cc.updated=now();commit();go(cur,(cc.quotes[0]||{}).id);return}
});

let pkT,pkSel=-1,pkList=[];
$("#main").addEventListener("input",e=>{if(e.target.id!=="pk")return;clearTimeout(pkT);pkT=setTimeout(()=>pkSearch(e.target.value),120)});
$("#main").addEventListener("keydown",e=>{if(e.target.id!=="pk")return;const r=$("#pkr");if(r.hidden)return;const bs=$$("button",r);
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();pkSel=(pkSel+(e.key==="ArrowDown"?1:-1)+bs.length)%bs.length;bs.forEach((b,i)=>b.classList.toggle("on",i===pkSel));bs[pkSel]&&bs[pkSel].scrollIntoView({block:"nearest"})}
  if(e.key==="Enter"&&bs[pkSel]){e.preventDefault();bs[pkSel].click()}if(e.key==="Escape"){r.hidden=true}});
document.addEventListener("click",e=>{const r=$("#pkr");if(r&&!e.target.closest(".pick"))r.hidden=true});
async function pkSearch(v){const r=$("#pkr");v=v.trim().toLowerCase();if(!v){r.hidden=true;return}
  const P=await loadProds(),words=v.split(/\s+/);
  pkList=[];P.forEach(p=>{const hay=(p.n+" "+p.id+" "+(p.sub||"")+" "+p.v.map(x=>x.sku+" "+x.c).join(" ")).toLowerCase();if(!words.every(w=>hay.includes(w)))return;
    const seen=new Set();p.v.forEach(x=>{const key=x.c||"";if(seen.has(key))return;seen.add(key);pkList.push({p,v:x})})});
  pkList=pkList.slice(0,40);pkSel=-1;
  r.innerHTML=pkList.length?pkList.map((o,i)=>`<button type="button" role="option" data-pk="${i}"><span class="th">${imgHTML(o.v.img||o.p.img)}</span><span><b>${esc(o.p.n)}</b><small>${esc([o.v.sku,o.v.c,o.p.sub].filter(Boolean).join(" · "))}</small></span></button>`).join(""):`<div class="none">לא מצאנו. אפשר להוסיף "שורה חופשית".</div>`;
  r.hidden=false;$("#pk").setAttribute("aria-expanded","true")}
$("#main").addEventListener("click",e=>{const b=e.target.closest("[data-pk]");if(!b)return;const o=pkList[+b.dataset.pk],q=curQuote();
  const raw=o.p.demo?{id:o.p.id,q:1}:{id:o.v.sku+"|"+(o.v.c||""),q:1,src:"cat",pid:o.p.id,sku:o.v.sku,n:o.p.n,fin:o.v.c||"",img:o.v.img||o.p.img||"",k:o.p.k||""};
  const ex=q.lines.find(l=>l.key===raw.id);
  if(ex){ex.q=Math.min(999,ex.q+1);toast(`${o.p.n}: הכמות עלתה ל-${ex.q}`)}
  else{const f=S.fromCart(raw);q.lines.push(Object.assign({lid:uid("l"),price:null,room:"",note:"",bought:0,boughtAt:"",added:now(),manual:true},f,{price:db.prices[f.sku]?db.prices[f.sku].p:null}));toast(`נוסף: ${o.p.n}`)}
  touch(q);renderMain();const pk=$("#pk");pk&&pk.focus()});

/* ---------------- WhatsApp + print ---------------- */
function quoteText(c,q){const t=totals(q),by=groupRooms(q.lines);
  let s=`שלום ${c.name.replace(/^משפחת\s+/,"")},\nמצורפת הצעת המחיר מספוטליין (מס׳ ${q.no}):\n`;
  by.forEach(([room,L])=>{if(room)s+=`\n*${room}*\n`;else if(by.length>1)s+="\n";L.forEach(l=>{s+=`• ${l.n}${l.fin?` (${l.fin})`:""} × ${l.q}${lineTot(l)!=null?` - ${ils(lineTot(l))}`:""}\n`})});
  if(t.disc)s+=`\nהנחה: ${ils(t.disc)}`;s+=`\n*סה״כ: ${ils(t.gross)}* כולל מע״מ\n`;
  if(t.miss)s+=`(${t.miss} פריטים יתומחרו בנפרד)\n`;
  if(q.note)s+=`\n${q.note}\n`;
  s+=`\nההצעה בתוקף עד ${dmy(q.issued+q.valid*864e5)}.\nספוטליין · ${STORE.addr} · ${STORE.phone}`;return s}
function sendWA(c,q){if(!c.phone)return;q.issued=now();if(q.status==="draft"){q.status="sent";q.sentAt=now()}log(c,`${q.title} נשלחה בוואטסאפ (${ils(totals(q).gross)})`);touch(q);renderMain();renderList();
  window.open(`https://wa.me/${waNum(c.phone)}?text=${encodeURIComponent(quoteText(c,q))}`,"_blank","noopener")}
function groupRooms(L){const m=new Map();L.forEach(l=>{const k=(l.room||"").trim();if(!m.has(k))m.set(k,[]);m.get(k).push(l)});const a=[...m.entries()];a.sort((x,y)=>(x[0]===""?1:0)-(y[0]===""?1:0));return a}
function printQuote(c,q){
  q.issued=now();
  const t=totals(q),G=groupRooms(q.lines),rooms=G.length>1||G[0]&&G[0][0];
  $("#doc").innerHTML=`<div class="d-h">${LOGO}<div class="st"><b>${STORE.name}</b> · ${STORE.line}<br>${STORE.addr}<br><span class="ltr">${STORE.phone}</span></div></div>
  <div class="d-t"><h1>הצעת מחיר<small>${esc(q.title)}</small></h1><dl><dt>מספר</dt><dd class="ltr">${q.no}</dd><dt>תאריך</dt><dd>${dmy(now())}</dd><dt>בתוקף עד</dt><dd>${dmy(q.issued+q.valid*864e5)}</dd></dl></div>
  <div class="d-c"><div><small>לכבוד</small><b>${esc(c.name)}</b></div><div><small>טלפון</small><b class="ltr">${esc(c.phone||"-")}</b></div><div><small>${c.addr?"כתובת":"עיר"}</small><b>${esc(c.addr||c.city||"-")}</b></div></div>
  <table class="d"><thead><tr><th class="im"></th><th>פריט</th><th class="c">כמות</th><th class="num">מחיר ליחידה</th><th class="num">סה״כ</th></tr></thead><tbody>
  ${G.map(([room,L])=>(rooms?`<tr class="room"><td colspan="5">${esc(room||"כללי")}</td></tr>`:"")+L.map(l=>`<tr><td class="im">${l.img?`<img src="${esc(l.img)}" alt="" onerror="this.remove()">`:""}</td><td class="nm"><b>${esc(l.n||"פריט")}</b><small>${esc([l.sku?"מק״ט "+l.sku:"",l.fin,l.k,l.note].filter(Boolean).join(" · "))}</small></td><td class="c">${l.q}</td><td class="num">${l.price!=null&&l.price!==""?ils(l.price):"-"}</td><td class="num">${lineTot(l)!=null?ils(lineTot(l)):"-"}</td></tr>`).join("")).join("")}
  </tbody></table>
  <div class="d-f"><div class="nt">${q.note?`<h4>הערות</h4><p>${esc(q.note)}</p>`:""}<h4>תנאים</h4><p>ההצעה בתוקף ${q.valid} ימים ממועד הוצאתה. ${q.vatIn?"המחירים כוללים מע״מ.":"המחירים לפני מע״מ."} זמני אספקה ייקבעו בעת ההזמנה, לפי מלאי הספק.${t.miss?` פריטים בלי מחיר יתומחרו בנפרד.`:""}</p></div>
  <div class="tt"><div><span>סכום ביניים</span><span>${ils(t.sub)}</span></div>${t.disc?`<div><span>הנחה</span><span>-${ils(t.disc)}</span></div>`:""}${q.vatIn?`<div><span>מתוכו מע״מ</span><span>${ils(t.vat)}</span></div>`:`<div><span>לפני מע״מ</span><span>${ils(t.net)}</span></div><div><span>מע״מ 18%</span><span>${ils(t.vat)}</span></div>`}<div class="g"><span>סה״כ לתשלום</span><span>${ils(t.gross)}</span></div><div class="y"></div></div></div>
  <div class="d-s"><div>חתימת הלקוח</div><div>בשם ספוטליין</div></div>
  <div class="d-b"><span>ספוטליין · מדליקים לכם כל חלום</span><span>הצעה ${q.no}</span></div>`;
  log(c,`${q.title} הודפסה`);c.updated=now();commit();
  const tt=document.title;document.title=`הצעת מחיר ${q.no} - ${c.name}`;
  const imgs=$$("#doc img");Promise.all(imgs.map(i=>i.complete?1:new Promise(r=>{i.onload=i.onerror=r;setTimeout(r,2500)}))).then(()=>{$$("#doc img").forEach(i=>{if(!i.naturalWidth)i.remove()});window.print();document.title=tt;renderMain();renderList()});
}

/* ---------------- menu ---------------- */
const menuB=$("#menuB"),menuP=$("#menuP");
menuB.addEventListener("click",()=>{const o=menuP.hidden;menuP.hidden=!o;menuB.setAttribute("aria-expanded",o)});
document.addEventListener("click",e=>{if(!e.target.closest(".menu")){menuP.hidden=true;menuB.setAttribute("aria-expanded","false")}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!menuP.hidden){menuP.hidden=true;menuB.focus()}});
$("#out").addEventListener("click",()=>{if(db.active)S.endClient();db=S.load()||db;db.staff=0;commit();location.hash="";gate()});
$("#chPin").addEventListener("click",async()=>{if(!await ask("להחליף את קוד הכניסה?","הקוד הנוכחי יימחק, ותבחרו קוד חדש של 4 ספרות.","החלפה"))return;db.pin=null;db.staff=0;commit();gate()});
$("#exp").addEventListener("click",()=>{const b=new Blob([JSON.stringify(db,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=`ספוטליין-לקוחות-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast(`ירד קובץ עם ${db.clients.length} לקוחות`)});
$("#imp").addEventListener("change",async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;let d;try{d=JSON.parse(await f.text())}catch(x){return toast("הקובץ לא נקרא. צריך קובץ גיבוי של אזור הלקוחות.")}
  if(!d||d.v!==1||!Array.isArray(d.clients))return toast("זה לא קובץ גיבוי של אזור הלקוחות.");
  const add=d.clients.filter(c=>!C(c.id));if(!await ask("לשחזר מהגיבוי?",`בקובץ ${d.clients.length} לקוחות. ${add.length} חדשים יתווספו, ולקוחות שכבר קיימים יישארו כמו שהם.`,"שחזור"))return;
  db.clients.push(...add);db.prices=Object.assign({},d.prices||{},db.prices);db.seq=Math.max(db.seq||0,d.seq||0);commit();renderList();toast(`נוספו ${add.length} לקוחות`)});

/* other tabs (the site in another tab adds to the basket) */
addEventListener("storage",e=>{if(e.key===S.DBK){const n=S.load();if(!n)return;const f=document.activeElement;db=n;if(f&&f.closest&&f.closest("#main")&&/INPUT|TEXTAREA|SELECT/.test(f.tagName))return;renderMain();renderList()}});

/* start */
db.staff>now()&&db.pin?enter():gate();
</script>
</body>
</html>
